<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The BLIS design in seven pages</title>
<style>
@page { size: Letter; margin: 0.9in; }
:root { color-scheme: light; }
html { background: #fff; }
body { font-family: Charter, "Iowan Old Style", Georgia, "Times New Roman", serif; font-size: 10.5pt; line-height: 1.36; color: #1b1f24; max-width: 6.7in; margin: 0 auto; padding: 0.4in 0.2in; }
h1 { font-size: 18pt; line-height: 1.15; margin: 0 0 0.35em; }
h2 { font-size: 12.5pt; line-height: 1.2; margin: 1.05em 0 0.3em; break-after: avoid; border-bottom: 1px solid #c9d1d9; padding-bottom: 2px; }
h3 { font-size: 10.5pt; margin: 0.8em 0 0.15em; break-after: avoid; }
p { margin: 0 0 0.5em; orphans: 3; widows: 3; }
.lead { font-size: 10.5pt; color: #3a424a; margin-bottom: 0.7em; }
ul, ol { margin: 0 0 0.5em; padding-left: 1.3em; }
ol { padding-left: 1.9em; }
li { margin: 0 0 0.2em; }
code { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 9pt; background: #f2f4f6; padding: 0 2px; border-radius: 2px; }
a { color: #1d4f91; text-decoration: none; }
.c { font-size: 8.5pt; color: #5b6570; white-space: nowrap; }
.c a { color: #5b6570; }
table { border-collapse: collapse; width: 100%; font-size: 9pt; line-height: 1.28; margin: 0.25em 0 0.6em; break-inside: avoid; }
th, td { border: 1px solid #c9d1d9; padding: 2px 5px; vertical-align: top; text-align: left; }
th { background: #eef1f4; font-weight: 600; }
figure { margin: 0.4em 0 0.6em; break-inside: avoid; }
figure svg { width: 100%; height: auto; display: block; color: #1b1f24; }
figcaption { font-size: 8.8pt; color: #3a424a; margin-top: 2px; line-height: 1.3; }
.tight li { margin-bottom: 0.1em; }
@media print { body { padding: 0; max-width: none; } a { color: inherit; } }
</style>
